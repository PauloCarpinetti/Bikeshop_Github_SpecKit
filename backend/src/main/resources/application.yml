spring:
  application:
    name: bikeshop-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/bikeshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:bikeshop}
    password: ${DB_PASSWORD:bikeshop}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  # Porta 8082 (não 8080/8081, já usadas por outros containers locais) para não conflitar.
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        # Necessário para os painéis de latência p95 dos dashboards Grafana (T089) — sem isso,
        # http_server_requests_seconds_* não expõe buckets de histograma no Prometheus.
        http.server.requests: true

# T090 (Fase 6): loga em console (padrão) E em arquivo — Promtail lê este arquivo montado do host
# para agregar no Loki (o backend roda nativamente, não em container).
logging:
  file:
    name: logs/backend.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

meilisearch:
  host: ${MEILISEARCH_HOST:http://localhost:7700}
  api-key: ${MEILISEARCH_API_KEY:masterKey}

bikeshop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3002}
  cart:
    ttl-days: ${CART_TTL_DAYS:30}
  admin:
    # Usuário administrativo de desenvolvimento (Fase 5), criado uma única vez no primeiro start.
    seed-email: ${ADMIN_SEED_EMAIL:admin@bikeshop.example}
    seed-password: ${ADMIN_SEED_PASSWORD:admin12345}
  correios:
    # Sem credenciais reais ainda -> CorreiosShippingProvider usa estimativa local (ver research.md).
    api-usuario: ${CORREIOS_API_USUARIO:}
    api-senha: ${CORREIOS_API_SENHA:}
  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    pagseguro:
      token: ${PAGSEGURO_TOKEN:}
      webhook-token: ${PAGSEGURO_WEBHOOK_TOKEN:}
  notifications:
    sendgrid:
      # Sem chave real -> confirmação de pedido é simulada (logada), não enviada de verdade.
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:pedidos@bikeshop.example}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.2
