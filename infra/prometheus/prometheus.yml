# T089 (Fase 6): scrape do backend BikeShop. O backend roda nativamente no host (mvn
# spring-boot:run), não em container — por isso o alvo é host.docker.internal, não um nome de
# serviço do compose (ver "extra_hosts" no serviço prometheus do docker-compose.yml).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: bikeshop-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
